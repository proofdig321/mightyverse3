[build]
builder = "dockerfile"
dockerfilePath = "mcp-server/Dockerfile"
buildContext = "mcp-server"
watchPaths = ["mcp-server/**"]

[deploy]
startCommand = "uvicorn mcp_coordinator:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/mcp/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

