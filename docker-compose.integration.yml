version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mightyverse_test
      POSTGRES_USER: mv_user
      POSTGRES_PASSWORD: mv_pass
    ports:
      - '5433:5432'
    volumes:
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mv_user -d mightyverse_test"]
      interval: 2s
      timeout: 2s
      retries: 30
