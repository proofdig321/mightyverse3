version: '3.8'
services:
  reverse-proxy:
    image: nginx:stable-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/certs:/etc/letsencrypt
    environment:
      - TZ=UTC

  web:
    image: your-registry/mightyverse-web:latest
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
    depends_on:
      - api
    deploy:
      replicas: 2

  api:
    image: your-registry/mightyverse-api:latest
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - S3_BUCKET=${S3_BUCKET}
    deploy:
      replicas: 2

  upload_service:
    image: your-registry/mightyverse-upload-service:latest
    environment:
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
    deploy:
      replicas: 2

  mcp:
    image: your-registry/mightyverse-mcp:latest
    environment:
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  n8n:
    image: n8nio/n8n:latest
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    deploy:
      replicas: 1

  worker:
    image: your-registry/mightyverse-worker:latest
    environment:
      - QUEUE_URL=redis://redis:6379
    deploy:
      replicas: 1

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mightyverse
      POSTGRES_USER: mv_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  pgdata:

# Notes:
# - Replace `your-registry/...` images with your CI-built images.
# - Use an orchestration platform (Docker Swarm, ECS, or Kubernetes) for production-grade deploys.
