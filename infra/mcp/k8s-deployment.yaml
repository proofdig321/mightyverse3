apiVersion: v1
kind: Namespace
metadata:
  name: mightyverse

---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-secrets
  namespace: mightyverse
type: Opaque
stringData:
  MCP_AUTH_TOKEN: "REPLACE_ME"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-coordinator
  namespace: mightyverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      containers:
        - name: mcp
          image: your-registry/mightyverse-mcp:latest
          env:
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: MCP_AUTH_TOKEN
            - name: DATABASE_URL
              value: "${DATABASE_URL}"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            exec:
              command: ["python","-c","import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 60

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-service
  namespace: mightyverse
spec:
  selector:
    app: mcp
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
